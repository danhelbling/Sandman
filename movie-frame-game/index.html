<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Name That Movie</title>
<style>
  :root {
    --bg: #0d0d10; --panel: #17171c; --line: #2a2a33; --text: #f2f0ea;
    --muted: #9a98a3; --accent: #f5c518; --good: #4ade80;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .35; cursor: default; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .04em; text-transform: uppercase; }
  header .spacer { flex: 1; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs button.on { border-color: var(--accent); color: var(--accent); }

  /* Game */
  #game { display: flex; flex-direction: column; height: calc(100% - 59px); }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; min-height: 0; position: relative; }
  .stage img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; box-shadow: 0 10px 40px #000a; }
  .stage .empty { color: var(--muted); text-align: center; max-width: 520px; }
  .label { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); background: #000b;
    padding: 4px 14px; border-radius: 999px; font-size: 14px; color: var(--muted); }
  .controls { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 14px 16px 20px; flex-wrap: wrap; }
  .dots { display: flex; gap: 8px; }
  .dot { width: 34px; height: 34px; border-radius: 50%; padding: 0; display: grid; place-items: center; font-weight: 600; }
  .dot.seen { border-color: var(--muted); }
  .dot.on { background: var(--accent); color: #111; border-color: var(--accent); }
  .answer { min-width: 260px; text-align: center; font-size: 22px; font-weight: 700; color: var(--good); }

  /* Setup */
  #setup { padding: 16px 20px 40px; display: none; }
  .slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 12px 0 18px; }
  .slot { border: 2px dashed var(--line); border-radius: 8px; aspect-ratio: 16/9; position: relative; overflow: hidden;
    cursor: pointer; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
  .slot.on { border-color: var(--accent); border-style: solid; }
  .slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .slot span { position: absolute; left: 6px; top: 6px; background: #000c; padding: 2px 8px; border-radius: 6px; font-size: 12px; z-index: 1; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
  .grid img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 6px; cursor: pointer; border: 2px solid transparent; }
  .grid img:hover { border-color: var(--muted); }
  .grid img.used { border-color: var(--accent); }
  .hint { color: var(--muted); font-size: 14px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  @media (max-width: 640px) { .slots { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body>
<header>
  <h1>Name That Movie</h1>
  <div class="tabs" id="movieTabs"></div>
  <div class="spacer"></div>
  <button id="modeBtn">Setup</button>
</header>

<main id="game">
  <div class="stage" id="stage"></div>
  <div class="controls">
    <button id="prevMovie">◀◀ Movie</button>
    <button id="prevFrame">◀ Frame</button>
    <div class="dots" id="dots"></div>
    <button id="nextFrame" class="primary">Frame ▶</button>
    <button id="reveal">Reveal</button>
    <button id="nextMovie">Movie ▶▶</button>
  </div>
  <div class="controls" style="padding-top:0"><div class="answer" id="answer"></div></div>
</main>

<section id="setup">
  <div class="row">
    <strong id="setupTitle"></strong>
    <span class="hint">Click a slot, then click a frame to put it there. Slot 1 = hardest, slot 5 = title screen.</span>
  </div>
  <div class="slots" id="slots"></div>
  <div class="row" style="margin-bottom:14px">
    <button id="clearPicks">Clear this movie</button>
    <button id="exportPicks" class="primary">Export picks.js</button>
    <span class="hint">Picks save in this browser automatically. Export and replace picks.js to keep them for good.</span>
  </div>
  <div class="grid" id="grid"></div>
</section>

<script src="movies.js"></script>
<script src="manifest.js"></script>
<script src="picks.js"></script>
<script>
const MOVIES = window.MOVIES || [];
const MANIFEST = window.FRAME_MANIFEST || {};
const LEVELS = ["Very hard", "Hard", "Medium", "Easy", "Title screen"];
const store = {
  get() { try { return JSON.parse(localStorage.getItem("nameThatMoviePicks") || "{}"); } catch { return {}; } },
  set(v) { try { localStorage.setItem("nameThatMoviePicks", JSON.stringify(v)); } catch {} }
};
let saved = store.get();
let movie = 0, frame = 0, revealed = false, mode = "game", slot = 0;
const seen = new Set();

function picksFor(m) {
  const id = MOVIES[m].id;
  const p = saved[id] || (window.FRAME_PICKS || {})[id];
  if (p && p.some(Boolean)) return p;
  const c = MANIFEST[id] || [];               // default: 5 frames spread across all candidates
  if (!c.length) return [];
  return [0, 1, 2, 3, 4].map(i => c[Math.min(c.length - 1, Math.round(i * (c.length - 1) / 4))]);
}

function el(tag, props = {}, kids = []) {
  const e = Object.assign(document.createElement(tag), props);
  kids.forEach(k => e.append(k));
  return e;
}

function renderTabs() {
  const t = document.getElementById("movieTabs"); t.innerHTML = "";
  MOVIES.forEach((m, i) => t.append(el("button", {
    textContent: "Movie " + (i + 1), className: i === movie ? "on" : "",
    onclick: () => goMovie(i)
  })));
}

function renderGame() {
  const picks = picksFor(movie);
  const stage = document.getElementById("stage"); stage.innerHTML = "";
  seen.add(movie + ":" + frame);
  if (!picks[frame]) {
    stage.append(el("div", { className: "empty", innerHTML:
      "<p><strong>No frames yet for Movie " + (movie + 1) + ".</strong></p>" +
      "<p>Run <code>./fetch_frames.sh</code> in this folder, then reload. Use Setup to pick the 5 frames.</p>" }));
  } else {
    stage.append(el("img", { src: picks[frame], alt: "Frame " + (frame + 1) }));
    stage.append(el("div", { className: "label", textContent: "Movie " + (movie + 1) + " · Frame " + (frame + 1) + " of 5 · " + LEVELS[frame] }));
  }
  const dots = document.getElementById("dots"); dots.innerHTML = "";
  for (let i = 0; i < 5; i++) dots.append(el("button", {
    className: "dot" + (i === frame ? " on" : seen.has(movie + ":" + i) ? " seen" : ""),
    textContent: i + 1, onclick: () => { frame = i; renderGame(); }
  }));
  document.getElementById("prevFrame").disabled = frame === 0;
  document.getElementById("nextFrame").disabled = frame === 4;
  document.getElementById("prevMovie").disabled = movie === 0;
  document.getElementById("nextMovie").disabled = movie === MOVIES.length - 1;
  document.getElementById("answer").textContent = revealed ? MOVIES[movie].title : "";
  document.getElementById("reveal").textContent = revealed ? "Hide" : "Reveal";
}

function renderSetup() {
  const id = MOVIES[movie].id;
  const picks = picksFor(movie).slice();
  while (picks.length < 5) picks.push(null);
  document.getElementById("setupTitle").textContent = "Movie " + (movie + 1) + ": " + MOVIES[movie].title;
  const slots = document.getElementById("slots"); slots.innerHTML = "";
  picks.forEach((src, i) => {
    const s = el("div", { className: "slot" + (i === slot ? " on" : ""), onclick: () => { slot = i; renderSetup(); } },
      [el("span", { textContent: (i + 1) + " · " + LEVELS[i] })]);
    if (src) s.append(el("img", { src })); else s.append("empty");
    slots.append(s);
  });
  const grid = document.getElementById("grid"); grid.innerHTML = "";
  const cands = MANIFEST[id] || [];
  if (!cands.length) grid.append(el("p", { className: "hint", textContent: "No candidate frames found. Run ./fetch_frames.sh first." }));
  cands.forEach(src => grid.append(el("img", {
    src, loading: "lazy", title: src, className: picks.includes(src) ? "used" : "",
    onclick: () => { picks[slot] = src; saved[id] = picks; store.set(saved); slot = Math.min(4, slot + 1); renderSetup(); }
  })));
}

function render() {
  renderTabs();
  document.getElementById("game").style.display = mode === "game" ? "flex" : "none";
  document.getElementById("setup").style.display = mode === "setup" ? "block" : "none";
  document.getElementById("modeBtn").textContent = mode === "game" ? "Setup" : "Play";
  mode === "game" ? renderGame() : renderSetup();
}

function goMovie(i) { movie = Math.max(0, Math.min(MOVIES.length - 1, i)); frame = 0; slot = 0; revealed = false; render(); }

document.getElementById("modeBtn").onclick = () => { mode = mode === "game" ? "setup" : "game"; render(); };
document.getElementById("prevFrame").onclick = () => { frame = Math.max(0, frame - 1); renderGame(); };
document.getElementById("nextFrame").onclick = () => { frame = Math.min(4, frame + 1); renderGame(); };
document.getElementById("prevMovie").onclick = () => goMovie(movie - 1);
document.getElementById("nextMovie").onclick = () => goMovie(movie + 1);
document.getElementById("reveal").onclick = () => { revealed = !revealed; renderGame(); };
document.getElementById("clearPicks").onclick = () => { delete saved[MOVIES[movie].id]; store.set(saved); slot = 0; renderSetup(); };
document.getElementById("exportPicks").onclick = () => {
  const all = {};
  MOVIES.forEach((m, i) => { all[m.id] = picksFor(i); });
  const blob = new Blob(["// Exported from Setup.\nwindow.FRAME_PICKS = " + JSON.stringify(all, null, 1) + ";\n"], { type: "text/javascript" });
  const a = el("a", { href: URL.createObjectURL(blob), download: "picks.js" }); a.click();
};
document.addEventListener("keydown", e => {
  if (mode !== "game") return;
  if (e.key === "ArrowRight") document.getElementById("nextFrame").click();
  else if (e.key === "ArrowLeft") document.getElementById("prevFrame").click();
  else if (e.key === "ArrowDown" || e.key === "n") goMovie(movie + 1);
  else if (e.key === "ArrowUp" || e.key === "p") goMovie(movie - 1);
  else if (e.key === " " || e.key === "r") { e.preventDefault(); revealed = !revealed; renderGame(); }
  else if (e.key === "f") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
});
render();
</script>
</body>
</html>
